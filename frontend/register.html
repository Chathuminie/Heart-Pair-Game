<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - HeartPair</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-blur"></div>
  <img src="images/logo.png" alt="HeartPair Logo" class="logo-top-left">

  <form class="form-container">
    <h2>Register</h2>
    <input type="text" id="name" autocomplete="name" aria-label="Full name" maxlength="80" placeholder="Full Name" required>
    <input type="email" id="email" autocomplete="email" aria-label="Email" placeholder="Email" required>
    <input type="password" id="password" autocomplete="new-password" aria-label="Password" minlength="8" placeholder="Password" required>
    <button class="primary-btn" id="register-btn">Sign Up</button>
    <p id="error" style="color: red;" role="alert" hidden></p>
    <p>Already have an account? <a href="login.html">Login</a></p>
  </form>

  <script type="module" src="js/auth-form.js"></script>
</body>
</html>
